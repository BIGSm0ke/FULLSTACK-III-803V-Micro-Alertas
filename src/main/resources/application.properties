spring.application.name=alertas
server.port=8083

# Configuración de Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/valle_del_sol_alertas
spring.datasource.username=root
spring.datasource.password=tu_password
spring.jpa.hibernate.ddl-auto=update

# Seguridad JWT (Debe ser la misma que en Usuarios [cite: 141])
jwt.secret.key=TuClaveSecretaCompartidaParaTodoElSistema2026

# Resilience4j - Circuit Breaker 
resilience4j.circuitbreaker.instances.alertasCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.alertasCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.alertasCB.wait-duration-in-open-state=10s